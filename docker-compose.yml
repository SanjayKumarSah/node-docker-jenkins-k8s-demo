services:
  jenkins:
    build:
      context: .
      dockerfile: JenkinsDockerfile
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
      # ADD THIS LINE: Mounts your Windows/WSL cluster configuration keys
      - ~/.kube:/root/.kube

volumes:
  jenkins_home:
